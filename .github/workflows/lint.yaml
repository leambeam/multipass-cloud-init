name: Lint
on:
  push:
    paths: ['mp-launch.sh', 'mp-delete.sh']
  pull_request:
    paths: ['mp-launch.sh', 'mp-delete.sh']
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo to the runner
        uses: actions/checkout@v7
        # Shellcheck is preinstalled on GitHub's Linux runner
      - name: Run ShellCheck
        run: shellcheck mp-launch.sh mp-delete.sh