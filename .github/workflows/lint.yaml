name: Lint
on:
  push:
    paths: ['*.sh', 'test/*.bash', 'test/test_helper/*.bash', 'completions/*.bash', 'helpers/*.sh']
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo to the runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          ignore_paths: >-
            test/bats
            test/test_helper/bats-assert
            test/test_helper/bats-support
            test/test_helper/bats-mock
            test/test_helper/bats-file
          check_together: 'yes'
