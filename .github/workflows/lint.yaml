name: Lint
on:
  push:
    paths: ['*.sh', '*.bash', 'test/*.sh', 'test/*.bash', 'test/test_helper/*.bash', 'completions/*.bash']
  workflow_dispatch:

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo to the runner
        uses: actions/checkout@v7
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: >-
            test/bats
            test/test_helper/bats-assert
            test/test_helper/bats-support
            test/test_helper/bats-mock
            test/test_helper/bats-file
          check_together: 'yes'
