name: Test
on:
  push:
    paths: ['*.sh', 'test/*.bash', 'test/test_helper/*.bash', 'test/*.bats', 'templates/*']
  workflow_dispatch:

jobs:
  bats:
    name: Bats
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo to the runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Run Bats
        shell: bash
        env:
          TERM: xterm-256color
        run: test/bats/bin/bats -p test